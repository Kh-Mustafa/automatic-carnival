name: Auto-merge Exercism sync

on:
  pull_request_target:
    types: [opened, reopened, synchronize]

permissions:
  contents: write
  pull-requests: write

jobs:
  merge:
    if: github.event.pull_request.user.login == 'exercism-solutions-syncer[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Merge the Exercism sync PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          for i in 1 2 3 4 5 6; do
            gh pr merge "$PR" --repo "$REPO" --merge --delete-branch && exit 0
            echo "Not mergeable yet, retrying in 20s..."; sleep 20
          done
          exit 1
